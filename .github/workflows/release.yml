name: Release

# Fires on the annotated tag that `/release` creates.
#
# This template's distribution is `cargo xtask deploy` (a remote
# Linux + systemd host), not a set of published binary archives, so
# there is deliberately **no build-and-publish matrix here** -- the
# tag's job is to run the heavier gates somewhere nobody can skip,
# not to mint release assets. A project that *does* ship binaries
# (a `cargo install` CLI, say) adds a build/publish job below, and
# puts `cargo xtask licenses --package <crate> --target <triple>
# --out <archive dir>/` in it: the licences of the crates a binary is
# built from require their texts to travel with it. It also copies
# the project's own `LICENSE` into that directory, which the
# generated file refers to.
#
# It can also be started by hand (Actions, Release, Run workflow) on
# any branch: the gates then run before a tag rather than only after
# one, and a re-run after an intermittent failure (#81) checks the
# same code again. Started by hand it only checks; it publishes
# nothing.
on:
  push:
    tags: [ "v*.*.*" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything every-push CI already runs, re-run at the tag.
  ci:
    uses: ./.github/workflows/ci.yml

  # The `validate` gates that every-push CI leaves out.
  #
  # They run here and not in ci.yml because each needs a tool the
  # runner does not ship, and paying for that on every push buys
  # little: a coverage or duplication regression is not urgent the
  # minute it lands, but shipping a release whose only check of
  # them happened on one developer's laptop is a different matter.
  # `/release` does run the full `cargo xtask validate` before
  # tagging -- this is the copy that runs where nobody can skip it.
  #
  # **`audit` is one of them.** It reaches the network for state
  # that changes on its own, which is why it is absent from
  # every-push CI: an advisory published overnight would fail a
  # pull request that changed nothing. A release is the opposite
  # case -- an advisory is almost always filed against code already
  # shipped, so no check tied to *changed* dependencies can catch
  # it, and a release is the moment the current lockfile is about
  # to become what runs in production. It runs as the standalone
  # `cargo xtask audit`, which **errors** on a missing tool or an
  # unreachable advisory DB, where inside `validate` those degrade
  # to a warning -- the wrong trade for a release.
  gates:
    name: Coverage, duplication and audit
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add llvm-tools-preview

      # **No `~/.cargo/bin` cache for these tools, and installed
      # `--force`.** cargo-llvm-cov runs the instrumented test
      # suite with the runner's privileges, so a wholesale-
      # restored bin cache under a fixed key is an
      # arbitrary-code-execution vector for it -- the same reason
      # cargo-audit below is installed uncached. `--force`
      # rebuilds rather than trusting a binary already on `PATH`.
      # Releases are infrequent, so paying the fresh build each
      # time is the cheaper trade than trusting a replayed cache.
      # cargo-llvm-cov is pinned: an unpinned install takes whatever
      # was released last, so its measurement could change with no
      # change here. Bump it deliberately, as with the toolchain.
      - name: Install gate tools (uncached)
        run: |
          cargo install --locked --force cargo-llvm-cov@0.9.1
          cargo install --locked --force code-dupes

      # `cargo-audit` is installed separately and **never from the
      # cache**, because it is the tool the security gate consists
      # of. The `command -v X || cargo install X` idiom above is
      # satisfied by *any* file named `cargo-audit` on `PATH`, and
      # `~/.cargo/bin` is restored wholesale from a cache under a
      # fixed key -- so a poisoned or merely broken entry would make
      # the audit step trivially passable while the release claims
      # the advisory DB was consulted. Pinned, and the version is
      # echoed so the log records what actually ran.
      - name: Install cargo-audit (uncached)
        run: |
          cargo install --locked --force cargo-audit@0.22.2
          cargo audit --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-gates-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-gates-

      - name: Coverage
        run: cargo xtask coverage

      - name: Duplication
        run: cargo xtask dupes

      # Last, and standalone rather than through `validate`: this
      # spelling errors on a missing tool or an unreachable
      # advisory DB instead of warning, so a release cannot pass
      # this job without the RUSTSEC database actually having been
      # consulted.
      - name: Security audit
        run: cargo xtask audit
