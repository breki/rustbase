[package]
name = "rustbase-xtask"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Shared cargo-xtask tooling for rustbase-derived projects"
repository = "https://github.com/breki/rustbase"
readme = "README.md"
keywords = ["xtask", "cargo", "ci", "lint", "tooling"]
categories = ["development-tools", "development-tools::build-utils"]

[lints]
workspace = true

[features]
# Enables `cli` (the library's subcommands, for an xtask CLI) and
# derives `clap::ValueEnum` on the public enums.
clap = ["dep:clap"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
serde_json = "1"
